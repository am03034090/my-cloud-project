<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشروعي السحابي الأول</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f4f8; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #0070f3; }
    </style>
</head>
<body>
    <div class="card">
        <h1>تهانينا! مشروعك يعمل بنجاح على السحاب ☁️</h1>
        <p>هذا الموقع مستضاف بالكامل في بيئة سحابية مجانية.</p>
        <p id="time"></p>
    </div>
    <script>
        document.getElementById('time').innerText = "الوقت الحالي بتوقيت جهازك: " + new Date().toLocaleTimeString();
    </script>
</body>
</html>
